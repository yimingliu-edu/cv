name: Update Scholar Metrics

on:
  # 00:00 UTC = 08:00 Hong Kong time (HKT, UTC+8)
  schedule:
    - cron: "0 0 * * *"
  # Manual trigger for testing
  workflow_dispatch:
  # Re-run if a previous run failed
  workflow_call:

# Avoid concurrent runs that race on the same JSON
concurrency:
  group: scholar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # We need full history so we can git pull --rebase before push
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch scholar data
        id: fetch
        run: |
          python scripts/fetch_scholar.py
        continue-on-error: true

      - name: Show result summary
        if: always()
        run: |
          echo "--- data/scholar.json ---"
          cat data/scholar.json || echo "(missing)"
          echo "--- end ---"

      - name: Configure git
        run: |
          git config user.name  "scholar-bot"
          git config user.email "scholar-bot@users.noreply.github.com"

      - name: Rebase onto latest main
        # Avoid push rejection if main has moved since this run started
        run: |
          git fetch origin main
          git rebase origin/main || {
            echo "::warning::rebase failed; falling back to merge"
            git rebase --abort || true
            git merge --no-edit --allow-unrelated-histories origin/main || true
          }

      - name: Commit and push
        run: |
          git add data/scholar.json
          if git diff --staged --quiet; then
            echo "No changes to scholar.json"
            echo "CHANGED=false" >> $GITHUB_ENV
          else
            TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            git commit -m "chore(scholar): refresh metrics [skip ci] ($TS)"
            git push origin HEAD:main
            echo "CHANGED=true" >> $GITHUB_ENV
          fi

      - name: Deploy to Cloudflare Pages
        run: |
          echo "Deploying static site to Cloudflare Pages..."
          npx wrangler pages deploy . --project-name yimingliu-cv --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
